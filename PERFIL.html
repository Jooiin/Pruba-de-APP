<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08090b"
    >

    <meta
        name="description"
        content="NOVA · Training"
    >

    <title>NOVA</title>


    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #08090b;

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro",
                "Segoe UI",
                Roboto,
                Inter,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }


        body {

            min-height: 100vh;
            min-height: 100dvh;
        }


        button {

            font: inherit;
        }



        /* =====================================================
           PANTALLA DE ENTRADA
           ===================================================== */

        .nova-entry {

            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            background: #08090b;
        }



        /* =====================================================
           IMAGEN
           ===================================================== */

        .nova-entry-background {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            overflow: hidden;

            background: #111216;
        }


        .nova-entry-background img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;
        }



        /* =====================================================
           OSCURECIMIENTO
           ===================================================== */

        .nova-entry-overlay {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.30) 0%,
                    rgba(0,0,0,.08) 35%,
                    rgba(0,0,0,.30) 60%,
                    rgba(0,0,0,.82) 100%
                );
        }



        /* =====================================================
           CONTENIDO
           ===================================================== */

        .nova-entry-content {

            position: relative;

            z-index: 3;

            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            padding:
                42px
                42px
                35px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }



        /* =====================================================
           MARCA
           ===================================================== */

        .nova-entry-brand {

            display: flex;

            flex-direction: column;

            gap: 5px;

            align-items: flex-start;
        }


        .nova-entry-brand-name {

            color: #ffffff;

            font-size: 25px;

            font-weight: 900;

            line-height: .9;

            letter-spacing: -.075em;
        }


        .nova-entry-brand-label {

            color:
                rgba(255,255,255,.58);

            font-size: 7px;

            font-weight: 800;

            letter-spacing: .25em;
        }



        /* =====================================================
           CENTRO
           ===================================================== */

        .nova-entry-center {

            width: 100%;

            max-width: 850px;

            margin: auto 0;

            padding:
                60px 0 40px;
        }


        .nova-entry-center h1 {

            color: #ffffff;

            font-size:
                clamp(
                    52px,
                    7vw,
                    100px
                );

            font-weight: 800;

            line-height: .88;

            letter-spacing: -.075em;
        }


        .nova-entry-center p {

            margin-top: 25px;

            max-width: 450px;

            color:
                rgba(255,255,255,.72);

            font-size: 14px;

            line-height: 1.65;
        }



        /* =====================================================
           BOTÓN PRÓXIMAMENTE
           ===================================================== */

        .nova-entry-actions {

            width: 100%;

            display: flex;

            align-items: center;
        }


        .nova-entry-button {

            min-width: 195px;

            min-height: 52px;

            padding:
                0 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;

            border-radius: 999px;

            border:
                1px solid
                rgba(255,255,255,.38);

            background:
                rgba(0,0,0,.20);

            color: #ffffff;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            font-size: 9px;

            font-weight: 900;

            letter-spacing: .12em;

            cursor: default;
        }


        .nova-entry-button span:last-child {

            font-size: 17px;

            font-weight: 400;
        }



        /* =====================================================
           FOOTER
           ===================================================== */

        .nova-entry-footer {

            width: 100%;

            display: flex;

            justify-content: flex-end;

            padding-top: 25px;
        }


        .nova-entry-footer span {

            color:
                rgba(255,255,255,.38);

            font-size: 7px;

            font-weight: 800;

            letter-spacing: .18em;
        }



        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .nova-entry-content {

                padding:
                    28px
                    20px
                    max(
                        24px,
                        env(safe-area-inset-bottom)
                    );
            }


            .nova-entry-brand-name {

                font-size: 21px;
            }


            .nova-entry-brand-label {

                font-size: 6px;
            }


            .nova-entry-center {

                padding:
                    50px 0 30px;
            }


            .nova-entry-center h1 {

                font-size:
                    clamp(
                        46px,
                        14vw,
                        66px
                    );
            }


            .nova-entry-center p {

                margin-top: 19px;

                font-size: 13px;
            }


            .nova-entry-actions {

                width: 100%;
            }


            .nova-entry-button {

                width: 100%;

                min-height: 52px;
            }


            .nova-entry-footer {

                justify-content: center;
            }

        }



        /* =====================================================
           TABLET
           ===================================================== */

        @media (min-width: 601px)
        and (max-width: 900px) {

            .nova-entry-content {

                padding: 32px;
            }


            .nova-entry-center h1 {

                font-size:
                    clamp(
                        50px,
                        10vw,
                        78px
                    );
            }

        }



        /* =====================================================
           LANDSCAPE
           ===================================================== */

        @media (max-width: 800px)
        and (orientation: landscape) {

            .nova-entry-content {

                padding:
                    20px
                    28px;
            }


            .nova-entry-center {

                padding:
                    20px 0;
            }


            .nova-entry-center h1 {

                font-size:
                    clamp(
                        38px,
                        9vh,
                        58px
                    );
            }


            .nova-entry-center p {

                margin-top: 12px;
            }


            .nova-entry-button {

                width: auto;

                min-width: 180px;

                min-height: 46px;
            }


            .nova-entry-footer {

                display: none;
            }

        }



        /* =====================================================
           PANTALLAS BAJAS
           ===================================================== */

        @media (max-height: 600px) {

            .nova-entry-center {

                padding:
                    30px 0;
            }


            .nova-entry-center h1 {

                font-size:
                    clamp(
                        40px,
                        8vh,
                        58px
                    );
            }


            .nova-entry-center p {

                margin-top: 14px;
            }

        }



        /* =====================================================
           PANTALLAS MUY PEQUEÑAS
           ===================================================== */

        @media (max-width: 380px) {

            .nova-entry-content {

                padding-left: 17px;

                padding-right: 17px;
            }


            .nova-entry-center h1 {

                font-size: 44px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NOVA · ENTRY
     ========================================================= -->

<main class="nova-entry">


    <!-- =====================================================
         IMAGEN DE FONDO
         ===================================================== -->

    <div class="nova-entry-background">

        <img
            src="img/WhatsApp Image 2.jpeg"
            alt="NOVA Training"
        >

    </div>


    <!-- =====================================================
         OVERLAY
         ===================================================== -->

    <div class="nova-entry-overlay"></div>


    <!-- =====================================================
         CONTENIDO
         ===================================================== -->

    <div class="nova-entry-content">


        <!-- =================================================
             MARCA
             ================================================= -->

        <div class="nova-entry-brand">

            <span class="nova-entry-brand-name">
                NOVA
            </span>

            <span class="nova-entry-brand-label">
                TRAINING
            </span>

        </div>



        <!-- =================================================
             CENTRO
             ================================================= -->

        <div class="nova-entry-center">

            <h1>
                Entrena.<br>
                Evoluciona.
            </h1>

            <p>
                Tu entrenamiento comienza aquí.
            </p>

        </div>



        <!-- =================================================
             BOTÓN
             ================================================= -->

<a
    href="training.html"
    class="nova-entry-button"
>

    <span>
        PRÓXIMAMENTE
    </span>

    <span>
        →
    </span>

</a>



        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="nova-entry-footer">

            <span>
                NOVA · TRAINING
            </span>

        </div>


    </div>

</main>


</body>

</html>
